[core]
reloadable = false
# Load at the start, load all schemas with order -100 (with order -1000 the USD libs are loaded)
order = -100

[package]
# Semantic Versionning is used: https://semver.org/
version = "1.4.0"

# The title and description fields are primarly for displaying extension info in UI
title = "CAE USD Plugins"
description = "Extension providing USD schemas and file-format plugins for CAE data formats."

# Path (relative to the root) or content of readme markdown file for UI.
readme  = "docs/README.md"

# One of categories for UI.
category = "CAE"

# Keywords for the extension
keywords = ["kit", "cae", "usd", "plugins", "fileformat", "schemas", "flash", "amr", "nanovdb", "trimesh"]

# Location of change log file in target (final) folder of extension, relative to the root.
# More info on writing changelog: https://keepachangelog.com/en/1.0.0/
changelog="docs/CHANGELOG.md"

[package.writeTarget]
# Extension must be written into the USD plugin path so that USD plugin discovery
# picks up the plugin/ directory and registers the SdfFileFormat plugins.
kit = true
usd = true

[dependencies]
"omni.cae.pip_prebundle" = {}
"omni.usd" = {}
"omni.warp.core" = {}

[[native.library]]
"filter:platform"."windows-x86_64"."path" = "plugin/usd/omniSciFileFormatShared.dll"

[[native.library]]
"filter:platform"."windows-x86_64"."path" = "plugin/usd/omniSciFileFormatPythonShared.dll"

# Main python module this extension provides, it will be publicly available as "import omni.cae.usd_plugins".
[[python.module]]
name = "omni.cae.usd_plugins"

[[python.module]]
path = "lib/python"

[documentation]
pages = [
    "docs/CHANGELOG.md",
]
